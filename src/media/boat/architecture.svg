<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" fill="#18212e">
  <rect width="640" height="700" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#18212e"/></marker></defs>
  <text x="20" y="34" font-weight="600" font-size="20">On shore: one laptop</text>
  <rect x="20" y="48" width="600" height="130" fill="#edf0f4"/>
  <rect x="36" y="62" width="568" height="46" fill="#fff" stroke="#18212e" stroke-width="1.5"/>
  <text x="320" y="92" text-anchor="middle" font-weight="600">QGroundControl: drive and vehicle state</text>
  <rect x="36" y="118" width="568" height="46" fill="#fff" stroke="#18212e" stroke-width="1.5"/>
  <text x="320" y="148" text-anchor="middle" font-weight="600">Browser dashboard: video, camera, battery</text>

  <line x1="320" y1="182" x2="320" y2="270" stroke="#18212e" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="150" y="204" width="340" height="44" fill="#1746c8"/>
  <text x="320" y="233" text-anchor="middle" fill="#fff" font-weight="600">Tailscale mesh over Starlink</text>

