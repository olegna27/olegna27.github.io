  <rect x="20" y="314" width="600" height="366" fill="#edf0f4"/>
  <rect x="36" y="328" width="568" height="170" fill="#fff" stroke="#18212e" stroke-width="1.5"/>
  <text x="52" y="358" font-weight="700">NVIDIA Jetson Orin Nano</text>
  <rect x="52" y="372" width="262" height="48" fill="#edf0f4"/><text x="183" y="403" text-anchor="middle" font-size="19">MAVLink router</text>
  <rect x="326" y="372" width="262" height="48" fill="#edf0f4"/><text x="457" y="403" text-anchor="middle" font-size="19">WebRTC video server</text>
  <rect x="52" y="432" width="262" height="48" fill="#edf0f4"/><text x="183" y="463" text-anchor="middle" font-size="19">Dashboard server</text>
  <rect x="326" y="432" width="262" height="48" fill="#edf0f4"/><text x="457" y="463" text-anchor="middle" font-size="19">Battery daemon</text>

  <line x1="126" y1="498" x2="126" y2="560" stroke="#18212e" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="136" y="536" font-size="17" fill="#55616f">USB</text>
  <line x1="320" y1="498" x2="320" y2="560" stroke="#18212e" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="330" y="536" font-size="17" fill="#55616f">Ethernet</text>
  <line x1="514" y1="498" x2="514" y2="560" stroke="#18212e" stroke-width="2.5" marker-start="url(#a)"/>
  <text x="524" y="536" font-size="17" fill="#55616f">RS485</text>

  <rect x="36" y="562" width="180" height="100" fill="#fff" stroke="#18212e" stroke-width="1.5"/>
  <text x="126" y="596" text-anchor="middle" font-weight="600">Pixhawk 6X</text>
  <text x="126" y="622" text-anchor="middle" font-size="17" fill="#55616f">ArduRover,</text>
  <text x="126" y="644" text-anchor="middle" font-size="17" fill="#55616f">two motors</text>
  <rect x="230" y="562" width="180" height="100" fill="#fff" stroke="#18212e" stroke-width="1.5"/>
  <text x="320" y="596" text-anchor="middle" font-weight="600">IP camera</text>
  <text x="320" y="622" text-anchor="middle" font-size="17" fill="#55616f">pan, tilt, zoom</text>
  <text x="320" y="644" text-anchor="middle" font-size="17" fill="#55616f">over ONVIF</text>
  <rect x="424" y="562" width="180" height="100" fill="#fff" stroke="#18212e" stroke-width="1.5"/>
  <text x="514" y="596" text-anchor="middle" font-weight="600">48 V battery</text>
  <text x="514" y="622" text-anchor="middle" font-size="17" fill="#55616f">16 cells,</text>
